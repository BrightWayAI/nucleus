name: Validate Nucleus

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate coordinated release snapshots
        run: python3 scripts/release_ecosystem.py check --all
      - name: Compile release tooling
        run: python3 -m py_compile scripts/release_ecosystem.py scripts/validate_connector_report.py
      - name: Test release and connector evidence validation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
